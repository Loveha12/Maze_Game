plugins {
    id 'java'
    id 'antlr'
    id "org.openjfx.javafxplugin" version "0.1.0"
}

group = 'edu.curtin.saed'
version = '1.0'

repositories {
    mavenCentral()
}

javafx {
    version = "19.0.2.1"  // Last JavaFX version compatible with Java 11
    modules = [ "javafx.controls" ]
}

dependencies {
    implementation 'org.antlr:antlr4-runtime:4.13.1'
    antlr 'org.antlr:antlr4:4.13.1'
    testImplementation "junit:junit:4.13"
}

generateGrammarSource {
    // This setting tells ANTLR to place the generated files into this package.
    // It matches the directory structure we created: .../antlr/edu/...
    arguments += [ '-package', 'edu.curtin.saed.assignment2' ]
}